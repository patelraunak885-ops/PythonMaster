
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: .venv/Scripts/python.exe -m ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff format
        entry: .venv/Scripts/python.exe -m ruff format
        language: system
        types: [python]

      - id: mypy
        name: mypy type check
        entry: .venv/Scripts/python.exe -m mypy --explicit-package-bases src tests
        language: system
        pass_filenames: false
        always_run: true


